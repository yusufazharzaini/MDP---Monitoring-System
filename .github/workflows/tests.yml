name: CI

on:
  # Only main is built on push. Feature branches are covered by pull_request,
  # and listing them here too made every pushed commit on an open PR start two
  # independent runs - which is why the PR showed 8 checks for 4 jobs.
  push:
    branches: [main]
  pull_request:

# A newer commit makes an in-flight run for the same ref obsolete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 8.4 only: the dependency tree pins Symfony 8.1, which requires PHP
        # >= 8.4.1, so composer install cannot even resolve on 8.3. The matrix
        # is kept so a future version is one line.
        php: ['8.4']

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, intl, gd
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          sed -i 's|^DB_CONNECTION=.*|DB_CONNECTION=sqlite|' .env
          sed -i "s|^DB_DATABASE=.*|DB_DATABASE=$GITHUB_WORKSPACE/database/database.sqlite|" .env
          sed -i 's|^CACHE_STORE=.*|CACHE_STORE=file|' .env
          sed -i 's|^SESSION_DRIVER=.*|SESSION_DRIVER=file|' .env
          touch database/database.sqlite
          php artisan key:generate

      - name: Check code style
        run: ./vendor/bin/pint --test

      - name: Run migrations and seeders against a clean database
        run: php artisan migrate:fresh --seed --force

      - name: Run test suite
        run: php artisan test

  # SQLite skips the 26 CHECK constraints and emits no row locks, so a green
  # run above proves neither. This job is where the schema's own guarantees are
  # actually exercised - it is what caught DROP CHECK portability, the four
  # composite indexes InnoDB adopts as foreign-key indexes, and a SELECT * under
  # GROUP BY that ONLY_FULL_GROUP_BY rejects.
  mysql:
    name: Backend (MySQL 8)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: mdp_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, mysql, pdo_mysql, intl, gd
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-mysql-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run test suite against MySQL
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: mdp_testing
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test

  # A migration that cannot be undone is a migration that cannot be deployed
  # safely. Rolling all the way back on MySQL is where the FK-adopted-index bug
  # lived, and SQLite could not see it.
  rollback:
    name: Migrate and roll back (MySQL 8)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: mdp_rollback
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: mdp_rollback
      DB_USERNAME: root
      DB_PASSWORD: root

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, mysql, pdo_mysql, intl, gd
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-mysql-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Migrate and seed
        run: php artisan migrate:fresh --seed --force

      - name: Roll every migration back
        run: php artisan migrate:reset --force

      - name: Assert the schema is empty
        run: |
          REMAINING=$(mysql -h 127.0.0.1 -uroot -proot -N -B -e \
            "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = 'mdp_rollback' AND table_name <> 'migrations';")
          echo "tables left besides migrations: $REMAINING"
          test "$REMAINING" -eq 0

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build assets
        run: npm run build
